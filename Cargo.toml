[workspace]
resolver = "2"
members = ["crates/*"]

[package]
name = "baram-warp4"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
uefi = { version = "0.38", features = ["alloc", "logger", "global_allocator"] }
uefi-raw = { version = "0.15" }
libm = "0.2"
kurbo = { version = "0.13", default-features = false, features = ["libm"] }
blake3 = { version = "1.8.5", default-features = false, features = ["pure"] }
esp-hal = { version = "1.2", default-features = false }
embedded-hal = { version = "1" }
esp-bootloader-esp-idf = { version = "0.6" }

[features]
default = ["ttf"]
ttf = ["baram-font/ttf", "baram-graphics/ttf"]
bdf = ["baram-font/bdf", "baram-graphics/bdf"]
uefi = ["dep:uefi", "baram-core/uefi", "baram-bsd/uefi", "baram-font/uefi"]
esp32s3 = ["dep:esp-hal", "dep:embedded-hal", "esp-hal/esp32s3", "esp-hal/rt"]
esp32c3 = [
    "dep:esp-hal",
    "dep:embedded-hal",
    "dep:esp-alloc",
    "dep:esp-println",
    "dep:nb",
    "dep:esp-bootloader-esp-idf",
    "esp-bootloader-esp-idf/esp32c3",
    "baram-core/esp32c3",
    "baram-bsd/esp32c3",
    "baram-font/esp32c3",
    "esp-alloc/esp32c3",
    "esp-hal/esp32c3",
    "esp-hal/rt",
    "esp-hal/unstable",
]

[[example]]
name = "esp32c3"
path = "examples/esp32c3.rs"
required-features = ["esp32c3", "bdf"]

[dependencies]
baram-bsd = { path = "crates/baram-bsd", default-features = false }
baram-core = { path = "crates/baram-core", default-features = false }
baram-font = { path = "crates/baram-font", default-features = false }
baram-graphics = { path = "crates/baram-graphics", default-features = false }
uefi = { workspace = true, optional = true }
esp-hal = { workspace = true, optional = true }
embedded-hal = { workspace = true, optional = true }
esp-alloc = { version = "0.11.0", optional = true }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32c3", "jtag-serial"], optional = true }
nb = { version = "1.1.0", optional = true }
esp-bootloader-esp-idf = { workspace = true, optional = true }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
